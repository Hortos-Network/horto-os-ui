[package]
name = "horto-os-ui-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Horto OS UI MCP server (stdio or Streamable HTTP): status, backup, setup, doctor"

[[bin]]
name = "horto-os-ui-mcp"
path = "src/main.rs"

[lib]
name = "horto_os_ui_mcp"
path = "src/lib.rs"

[dependencies]
horto-os-ui-shared.workspace = true
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rmcp = { version = "3", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "io-util",
    "net",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
missing_docs = "deny"
