[package]
name = "horto-os-ui-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Horto OS UI box setup engine: modular steps, kits, and ops"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
libc = "0.2"
rust-embed = "8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
which = "8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"
