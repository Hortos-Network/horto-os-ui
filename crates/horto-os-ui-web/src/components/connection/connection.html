<section class="connection panel" aria-label="Connection">
  <h2>Connection</h2>
  <div class="connection__row">
    <label for="horto-box-url">Status API</label>
    <input
      id="horto-box-url"
      type="url"
      [(value)]="url"
      spellcheck="false"
      autocomplete="off"
    />
    <input
      id="horto-box-token"
      type="password"
      [(value)]="token"
      placeholder="Bearer token if the API requires one"
      autocomplete="off"
    />
    <button
      type="button"
      class="connection__refresh"
      [class.connection__refresh--busy]="busy"
      (click)="refresh()"
    >
      Refresh
    </button>
  </div>
  <p
    class="connection__status"
    [class.connection__status--ok]="statusOk"
    [class.connection__status--bad]="statusBad"
    [class.connection__status--warn]="statusWarn"
  >
    {{ statusLabel }}
  </p>
  <p class="connection__error" role="alert" [class.is-visible]="hasError">
    {{ errorDetail }}
  </p>

  <h3>Remote install (OpenSSH)</h3>
  <p class="connection__hint">
    First install from this PC. Auth is system OpenSSH (config / agent / askpass). Key
    install is off unless you check the box.
  </p>
  <div class="connection__row">
    <label for="horto-ssh-host">SSH Host</label>
    <input
      id="horto-ssh-host"
      type="text"
      [(value)]="sshHost"
      placeholder="Host alias or user@host"
      spellcheck="false"
      autocomplete="off"
    />
    <label class="connection__check">
      <input type="checkbox" [(checked)]="installSshKey" />
      Install this PC public key on the box
    </label>
    <button
      type="button"
      class="connection__refresh"
      [class.connection__refresh--busy]="remoteBusy"
      (click)="remoteSetup()"
    >
      Remote dry-run setup
    </button>
  </div>
  <p class="connection__remote-log" [class.is-visible]="hasRemoteLog">
    {{ remoteLog }}
  </p>
</section>
