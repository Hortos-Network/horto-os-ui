<header class="top-bar">
  <div class="top-bar__brand">
    <img
      class="top-bar__logo"
      src="/hortos-logo.png"
      width="48"
      height="48"
      alt="Hortos"
    />
    <div class="top-bar__brand-text">
      <h1 class="top-bar__title">Horto</h1>
      <p class="top-bar__tagline">Your box at a glance.</p>
    </div>
  </div>
  <div class="top-bar__session">
    <button
      type="button"
      class="top-bar__link"
      [class.top-bar__link--up]="linkUp"
      [class.top-bar__link--down]="linkDown"
      [class.top-bar__link--pending]="linkPending"
      [class.top-bar__link--busy]="busy"
      [disabled]="busy"
      (click)="retryConnection()"
      [title]="linkTitle"
      [attr.aria-label]="linkTitle"
    >
      <span class="top-bar__link-dot" aria-hidden="true"></span>
    </button>
    <button
      type="button"
      class="top-bar__theme"
      (click)="cycleTheme()"
      [title]="themeTitle"
      [attr.aria-label]="themeTitle"
    >
      <span
        class="top-bar__theme-glyph"
        [class.is-hidden]="!isSystem"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" />
        </svg>
      </span>
      <span
        class="top-bar__theme-glyph"
        [class.is-hidden]="!isLight"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </span>
      <span
        class="top-bar__theme-glyph"
        [class.is-hidden]="!isDark"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" />
        </svg>
      </span>
    </button>
  </div>
</header>
<nav class="top-bar__tabs" aria-label="Primary">
  <button
    type="button"
    class="top-bar__tab"
    [class.top-bar__tab--active]="connectionActive"
    (click)="goConnection()"
  >
    <span class="top-bar__tab-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M8 12h8" />
        <path d="M10 8a4 4 0 0 0-4 4 4 4 0 0 0 4 4" />
        <path d="M14 8a4 4 0 0 1 4 4 4 4 0 0 1-4 4" />
      </svg>
    </span>
    Connection
  </button>
  <button
    type="button"
    class="top-bar__tab"
    [class.top-bar__tab--active]="overviewActive"
    (click)="goOverview()"
  >
    <span class="top-bar__tab-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </svg>
    </span>
    Overview
  </button>
  <button
    type="button"
    class="top-bar__tab"
    [class.top-bar__tab--active]="servicesActive"
    (click)="goServices()"
  >
    <span class="top-bar__tab-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h10" />
      </svg>
    </span>
    Services
  </button>
  <button
    type="button"
    class="top-bar__tab"
    [class.top-bar__tab--active]="logsActive"
    (click)="goLogs()"
  >
    <span class="top-bar__tab-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M8 6h13" />
        <path d="M8 12h13" />
        <path d="M8 18h13" />
        <path d="M3 6h.01" />
        <path d="M3 12h.01" />
        <path d="M3 18h.01" />
      </svg>
    </span>
    Logs
  </button>
</nav>
