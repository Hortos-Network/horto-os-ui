[package]
name = "horto-os-ui-web"
description = "Horto homeowner Leptos CSR UI (rangular templates; shared by Tauri and browser)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
leptos = { version = "0.8", features = ["csr"] }
rangular-aot = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }
rangular-expr = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }
rangular-host = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "HtmlElement",
    "Element",
    "MouseEvent",
    "Event",
    "CustomEvent",
    "EventTarget",
    "Url",
] }

[build-dependencies]
rangular-aot = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }
rangular-css = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }

# Used by rangular-aot generated sources (not referenced in hand-written Rust).
[package.metadata.cargo-machete]
ignored = ["rangular-expr"]
