[package]
name = "horto-os-ui-desktop"
description = "Horto homeowner desktop shell (Tauri 2 + Leptos web UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "horto_os_ui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "horto-os-ui-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
# Plain `cargo build` (Make) must embed Trunk frontendDist. Without this, Tauri
# falls back to build.devUrl (localhost:4187) and the window shows connection refused.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
