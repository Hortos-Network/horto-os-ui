[[permission]]
identifier = "allow-list-known-remote-hosts"
description = "List /etc/hosts and OpenSSH Host aliases"
commands.allow = ["list_known_remote_hosts_cmd"]

[[permission]]
identifier = "allow-remote-probe"
description = "Probe box architecture over OpenSSH"
commands.allow = ["remote_probe"]

[[permission]]
identifier = "allow-remote-surfaces-probe"
description = "Probe SSH CLI API MCP surfaces over OpenSSH"
commands.allow = ["remote_surfaces_probe", "remote_surfaces_text"]

[[permission]]
identifier = "allow-remote-setup"
description = "Run remote setup via OpenSSH apply agent"
commands.allow = ["remote_setup"]

[[permission]]
identifier = "allow-remote-upload-cli"
description = "Upload tip CLI agent to the box over OpenSSH"
commands.allow = ["remote_upload_cli_cmd"]

[[permission]]
identifier = "allow-tip-cli-version"
description = "Read tip CLI long-version baked into this Desktop"
commands.allow = ["tip_cli_version"]

[[permission]]
identifier = "allow-api-token"
description = "Read write and sync the shared Status API token file"
commands.allow = [
    "read_api_token",
    "write_api_token",
    "sync_api_token_from_box",
]

[[permission]]
identifier = "allow-local-host-metrics"
description = "Read local CPU disk and OS sensors on this PC"
commands.allow = ["local_host_metrics"]

[[permission]]
identifier = "allow-local-containers"
description = "List local Docker containers on this PC"
commands.allow = ["local_containers"]

[[permission]]
identifier = "allow-list-release-tags"
description = "List GitHub Release tags for the install picker"
commands.allow = ["list_release_tags_cmd"]
