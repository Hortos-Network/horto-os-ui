# cargo-deny configuration (run: `make deny`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
# GPUI (horto-os-ui-kpi) and Tauri (horto-os-ui-desktop) pull unmaintained
# transitive crates with no safe upgrade yet.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; pulled by gpui/cosmic-text/usvg" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; pulled by gpui text stack" },
    { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; pulled by gpui stack" },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; pulled by gpui stack" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; pulled by gpui stack" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; pulled by gpui stack" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive until deps move" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; pulled by tauri codegen stack" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained; pulled by tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained; pulled by tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained; pulled by tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained; pulled by tauri-utils/urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained; pulled by tauri-utils/urlpattern" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Interchouette-ITC/rangular"]
