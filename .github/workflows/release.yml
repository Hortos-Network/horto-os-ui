name: Release

# After creating GitHub Release tag vX.Y.Z (must match workspace Cargo.toml):
# build box + KPI + Desktop + status-api docker.tar.gz and attach to the Latest release.
# GHCR push is off until org package management lands (see issue #22).

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release tag matches Cargo.toml
        id: extract
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          ROOT_VERSION="$(awk '/^\[workspace.package\]/{p=1;next} p&&/^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          if [ "$VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag $VERSION != workspace Cargo.toml $ROOT_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "OK: tag $TAG matches $VERSION"

  assets:
    name: Build and attach assets
    needs: validate
    uses: ./.github/workflows/release-github-assets.yml
    secrets: inherit
    with:
      ref: ${{ github.event.release.tag_name }}
      tag: ${{ needs.validate.outputs.tag }}
      attach_to_release: true
      artifact_name: horto-stable-assets
