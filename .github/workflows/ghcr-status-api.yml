# GHCR tip push for status-api.
# Disabled until Hortos-Network package create/manage is enabled (issue #22).
# Image is shipped as Release docker.tar.gz instead. Re-enable this workflow when #22 is done.
name: ghcr-status-api

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/hortos-network/horto-os-ui-status-api

jobs:
  push-dev:
    name: Push :dev (disabled until #22)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:dev
