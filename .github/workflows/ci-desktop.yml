name: CI · desktop

on:
  pull_request:
    paths:
      - "crates/horto-os-ui-desktop/**"
      - "crates/horto-os-ui-web/**"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/rust-crate.yml"
  push:
    branches: [dev]
    paths:
      - "crates/horto-os-ui-desktop/**"
      - "crates/horto-os-ui-web/**"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/rust-crate.yml"

concurrency:
  group: ci-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-wasm:
    name: web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: desktop-web
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - name: Fmt
        run: cargo fmt -p horto-os-ui-web -- --check
      - name: Clippy (wasm)
        run: >
          cargo clippy -p horto-os-ui-web --target wasm32-unknown-unknown --all-targets
          -- -D warnings -D clippy::all
      - name: Trunk build
        run: trunk build --release
        working-directory: crates/horto-os-ui-web

  desktop-shell:
    name: desktop (tauri shell)
    runs-on: ubuntu-latest
    needs: web-wasm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: desktop-tauri
      - name: Install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - name: Trunk build (frontendDist)
        run: trunk build --release
        working-directory: crates/horto-os-ui-web
      - name: Fmt
        run: cargo fmt -p horto-os-ui-desktop -- --check
      - name: Clippy
        run: >
          cargo clippy -p horto-os-ui-desktop --all-targets
          -- -D warnings -D clippy::all
      - name: Build
        run: cargo build -p horto-os-ui-desktop
