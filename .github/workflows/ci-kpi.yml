# CI for horto-os-ui-kpi (GPUI ops viewer; optional / heavier).
# Does not depend on horto-os-ui-shared today; still listed for future.

name: CI · kpi

on:
  pull_request:
    paths:
      - "crates/horto-os-ui-kpi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/ci-kpi.yml"
  push:
    branches: [dev]
    paths:
      - "crates/horto-os-ui-kpi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/ci-kpi.yml"

concurrency:
  group: ci-kpi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crate:
    uses: ./.github/workflows/rust-crate.yml
    secrets: inherit
    with:
      package: horto-os-ui-kpi
      coverage: false
      doc: false
      publish_pages: false
      # GPUI links xcb / xkbcommon on Linux (not on bare ubuntu-latest).
      apt_packages: libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
