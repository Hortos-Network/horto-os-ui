# CI for horto-os-ui-mcp.

name: CI · mcp

on:
  pull_request:
    paths:
      - "crates/horto-os-ui-mcp/**"
      - "crates/horto-os-ui-shared/**"
      - "assets/**"
      - "docker/Dockerfile.mcp"
      - "docker/cursor-mcp-stdio.sh"
      - "docker/compose.box-mcp.yaml"
      - "packaging/systemd/horto-os-ui-mcp.service"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/rust-crate-doc.yml"
      - ".github/workflows/ci-mcp.yml"
  push:
    branches: [dev]
    paths:
      - "crates/horto-os-ui-mcp/**"
      - "crates/horto-os-ui-shared/**"
      - "assets/**"
      - "docker/Dockerfile.mcp"
      - "docker/cursor-mcp-stdio.sh"
      - "docker/compose.box-mcp.yaml"
      - "packaging/systemd/horto-os-ui-mcp.service"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/rust-crate-doc.yml"
      - ".github/workflows/ci-mcp.yml"

concurrency:
  group: ci-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crate:
    uses: ./.github/workflows/rust-crate.yml
    secrets: inherit
    with:
      package: horto-os-ui-mcp

  doc:
    uses: ./.github/workflows/rust-crate-doc.yml
    secrets: inherit
    with:
      package: horto-os-ui-mcp
      publish_pages: false
