# Workspace supply-chain: audit, deny, machete.
# Fires on lockfile / deny / root manifests / Makefile — not on every crate edit.

name: CI · supply-chain

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "**/Cargo.toml"
      - "Makefile"
      - ".github/workflows/ci-supply-chain.yml"
  push:
    branches: [dev]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "**/Cargo.toml"
      - "Makefile"
      - ".github/workflows/ci-supply-chain.yml"

concurrency:
  group: ci-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  supply-chain:
    name: audit · deny · machete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit --version 0.22.0
          cargo install --locked cargo-deny --version 0.20.2
      - name: Install cargo-machete
        run: cargo install --locked cargo-machete --version 0.9.2
      - name: Audit + deny + machete
        run: make audit && make deny && make machete
