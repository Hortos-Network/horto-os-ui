# CI for horto-os-ui-shared (library + embedded assets).
# Triggers when shared or assets change. Dependents also list this path.

name: CI · shared

on:
  pull_request:
    paths:
      - "crates/horto-os-ui-shared/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/rust-crate-doc.yml"
      - ".github/workflows/rust-crate-coverage.yml"
      - ".github/workflows/ci-shared.yml"
  push:
    branches: [dev]
    paths:
      - "crates/horto-os-ui-shared/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-crate.yml"
      - ".github/workflows/rust-crate-doc.yml"
      - ".github/workflows/rust-crate-coverage.yml"
      - ".github/workflows/ci-shared.yml"

concurrency:
  group: ci-shared-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crate:
    uses: ./.github/workflows/rust-crate.yml
    secrets: inherit
    with:
      package: horto-os-ui-shared

  doc:
    permissions:
      contents: write
    uses: ./.github/workflows/rust-crate-doc.yml
    secrets: inherit
    with:
      package: horto-os-ui-shared
      publish_pages: true

  coverage:
    uses: ./.github/workflows/rust-crate-coverage.yml
    secrets: inherit
    with:
      package: horto-os-ui-shared
