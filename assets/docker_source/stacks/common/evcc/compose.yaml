services:
  evcc:
    command:
      - evcc
    container_name: evcc
    image: evcc/evcc:latest
    ports:
      - 7070:7070/tcp
      - 8887:8887/tcp
      - 9522:9522/udp
      - 5353:5353/udp
      - 4712:4712/tcp
    volumes:
      - /home/user/evcc.yaml:/etc/evcc.yaml
      - /home/user/.evcc:/root/.evcc
      - /etc/machine-id:/etc/machine-id
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id
    network_mode: host
    restart: unless-stopped
    # optional:
    #user: <UID>:<GID>